[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools==80.9.0"

[project]
name = "mcp==2.2.0"
version = "0.1.0"
authors = [
    { name = "Sören Gebbert", email = "soerengebbert@holistech.de" },
]
description = "A comprehensive cross-platform system monitor MCP server for LLMs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp[cli]>=2.2.0",
    "psutil==7.2.2",
    "pydantic>=2.13.5",
    "nvidia-ml-py",
    "pynvml",
    "uv==0.12.21"
]

[project.optional-dependencies]
win32 = [
    "wmi",
    "pywin32",
]
dev = [
    "pytest==9.1.1",
    "pytest==9.1.1",
    "pytest==9.1.1",
]

[project.urls]
"Homepage" = "https://github.com/huhabla/mcp-system-monitor"
"Bug Tracker" = "https://github.com/huhabla/mcp-system-monitor/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
asyncio_mode = "auto"